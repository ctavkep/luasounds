<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>звуки для Lua</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #eee; max-width: 720px; margin: 40px auto; padding: 0 16px; }
    .item { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .row { display: flex; gap: 8px; margin-top: 8px; }
    input { flex: 1; background: #111; color: #4caf50; border: 1px solid #444; padding: 6px 8px; border-radius: 4px; }
    button { background: #2ea44f; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    button:hover { background: #268941; }
    audio { width: 100%; margin-top: 8px; height: 34px; }
  </style>
</head>
<body>
  <h2>Звуки из папки soundslua/</h2>
  <div id="list">Загрузка списка...</div>

  <script>
    const FOLDER = 'soundslua';
    const owner = location.hostname.split('.')[0];
    const repo = location.pathname.split('/').filter(Boolean)[0];
    const list = document.getElementById('list');

    fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${FOLDER}`)
      .then(r => r.json())
      .then(files => {
        if (!Array.isArray(files)) { list.textContent = `Папка ${FOLDER} не найдена`; return; }
        const audioFiles = files.filter(f => /\.(mp3|wav|ogg)$/i.test(f.name));
        if (!audioFiles.length) { list.textContent = `В папке ${FOLDER} пока нет аудиофайлов`; return; }

        list.innerHTML = '';
        audioFiles.forEach(f => {
          const url = `https://${location.hostname}/${repo}/${FOLDER}/${encodeURIComponent(f.name)}`;
          const div = document.createElement('div');
          div.className = 'item';

          const title = document.createElement('b');
          title.textContent = f.name;

          const audio = document.createElement('audio');
          audio.controls = true;
          audio.src = url;

          const row = document.createElement('div');
          row.className = 'row';

          const input = document.createElement('input');
          input.type = 'text';
          input.readOnly = true;
          input.value = url;
          input.onclick = () => input.select();

          const btn = document.createElement('button');
          btn.textContent = 'Копировать';
          btn.onclick = () => {
            navigator.clipboard.writeText(url);
            btn.textContent = 'Скопировано!';
            setTimeout(() => btn.textContent = 'Копировать', 1200);
          };

          row.append(input, btn);
          div.append(title, audio, row);
          list.appendChild(div);
        });
      })
      .catch(() => list.textContent = 'Не удалось загрузить список файлов');
  </script>
</body>
</html>
