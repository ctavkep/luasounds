<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>звуки для Lua</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #eee; max-width: 720px; margin: 40px auto; padding: 0 16px; }
    .item { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .row { display: flex; gap: 8px; margin-top: 8px; }
    input { flex: 1; background: #111; color: #4caf50; border: 1px solid #444; padding: 6px 8px; border-radius: 4px; }
    button { background: #2ea44f; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    button:hover { background: #268941; }
    audio { width: 100%; margin-top: 8px; height: 34px; }
  </style>
</head>
<body>
  <h2>Звуки из папки sounds/</h2>
  <div id="list">Загрузка списка...</div>

  <script>
    const owner = location.hostname.split('.')[0];
    const repo = location.pathname.split('/').filter(Boolean)[0];
    const list = document.getElementById('list');

    fetch(`https://api.github.com/repos/${owner}/${repo}/contents/sounds`)
      .then(r => r.json())
      .then(files => {
        if (!Array.isArray(files)) { list.textContent = 'Папка sounds не найдена'; return; }
        const audioFiles = files.filter(f => /\.(mp3|wav|ogg)$/i.test(f.name));
        if (!audioFiles.length) { list.textContent = 'В папке sounds пока нет аудиофайлов'; return; }

        list.innerHTML = '';
        audioFiles.forEach(f => {
          const url = `https://${location.hostname}/${repo}/sounds/${encodeURIComponent(f.name)}`;
          const div = document.createElement('div');
          div.className = 'item';
          div.innerHTML = `
            <b>${f.name}</b>
            <audio controls src="${url}"></audio>
            <div class="row">
              <input type="text" value="${url}" readonly onclick="this.select()">
              <button onclick="navigator.clipboard.writeText('${url}'); this.textContent='Скопировано!'; setTimeout(()=>this.textContent='Копировать',1200)">Копировать</button>
            </div>`;
          list.appendChild(div);
        });
      })
      .catch(() => list.textContent = 'Не удалось загрузить список файлов');
  </script>
</body>
</html>
